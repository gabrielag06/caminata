
name: Crear ejecutable de Windows

on:
  workflow_dispatch:
  push:
    paths:
      - '**.py'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy

      - name: Crear ejecutable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name CaminataAleatoria caminata_aleatoria

      - name: Guardar ejecutable para descargar
        uses: actions/upload-artifact@v4
        with:
          name: CaminataAleatoria-Windows
          path: dist/CaminataAleatoria.exe
